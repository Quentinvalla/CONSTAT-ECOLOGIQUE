<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constat écologique</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌍%3C/text%3E%3C/svg%3E">

<style>
:root {
    --fond: #f4f5ef;
    --texte: #172923;
    --vert: #315c49;
    --gris: #65736c;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: var(--fond);
    color: var(--texte);
    font-family: "Segoe UI", Arial, sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
}

.container {
    min-height: 100vh;
    padding: 25px 5%;
    display: flex;
    flex-direction: column;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    font-size: 13px;
    letter-spacing: 2px;
    font-weight: bold;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo span {
    font-size: 27px;
    line-height: 1;
}

#counter {
    color: var(--gris);
    white-space: nowrap;
}

main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 1200px;
    margin: auto;
}

.slide {
    display: none;
    width: 100%;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-items: center;
    gap: clamp(24px, 4vw, 56px);
    animation: apparition .5s ease;
}

.slide.active {
    display: grid;
}

@keyframes apparition {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.eyebrow {
    color: var(--vert);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 22px;
    text-transform: uppercase;
}

h1 {
    font-size: clamp(55px, 7vw, 100px);
    line-height: 1;
    letter-spacing: -5px;
    margin-bottom: 40px;
}

.cover h1 {
    margin-left: -8px;
}

h2 {
    font-size: clamp(35px, 5vw, 65px);
    line-height: 1.05;
    letter-spacing: -2px;
    margin-bottom: 25px;
}

.description {
    font-size: 19px;
    line-height: 1.7;
    color: #526158;
    max-width: 550px;
}

.note {
    margin-top: 28px;
    color: var(--vert);
    font-size: 14px;
    font-weight: bold;
}

.category-marker {
    display: table;
    max-width: 100%;
    margin-bottom: 16px;
    padding: 7px 11px;
    border-radius: 999px;
    background: #e2eadf;
    color: var(--vert);
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1.3px;
    line-height: 1.4;
    text-transform: uppercase;
}

.category-intro {
    grid-template-columns: minmax(0, 1fr) minmax(220px, .75fr);
}

.category-copy {
    padding: clamp(24px, 4vw, 48px);
    border: 1px solid #dce5d8;
    border-radius: 24px;
    background: linear-gradient(135deg, #e8eee4, #f1f3eb);
}

.category-copy h2 {
    margin-bottom: 20px;
    font-size: clamp(36px, 5vw, 64px);
}

.category-visual {
    min-height: min(400px, 55vh);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    border-radius: 50% 50% 24px 24px;
    background: radial-gradient(circle, #c9dfb9, #e5eadf);
    color: var(--vert);
}

.category-visual-number {
    font-size: clamp(100px, 16vw, 180px);
    font-weight: bold;
    letter-spacing: -10px;
    line-height: .9;
}

.category-visual-label {
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
}

.image {
    height: min(350px, 55vh);
    min-height: 220px;
    width: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    border-radius: 24px;
    background: #e0e8dc;
    box-shadow: 0 20px 50px #00000010;
}

.image img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    border-radius: 24px;
    transition: transform .3s ease;
}

.image img:hover {
    transform: scale(1.06);
}

.cover {
    grid-template-columns: 1.1fr .9fr;
}

.cover .image {
    height: min(400px, 60vh);
    border-radius: 24px;
    background: radial-gradient(circle, #c9dfb9, #e5eadf);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    color: var(--vert);
    font-size: 20px;
    font-weight: bold;
}

.conclusion {
    grid-template-columns: 1fr;
}

.conclusion h2 {
    font-size: clamp(50px, 7vw, 85px);
    max-width: 900px;
}

.conclusion .image {
    display: none;
}

footer {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 48px 48px;
    align-items: center;
    gap: 16px;
    margin-top: 20px;
}

.progress {
    height: 3px;
    background: #dce2d8;
    min-width: 0;
}

#bar {
    height: 100%;
    width: 0;
    background: var(--vert);
    display: block;
    transition: width .4s;
}

button {
    border: none;
    background: white;
    color: var(--texte);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    transition: .2s;
    flex-shrink: 0;
}

button:hover {
    background: var(--vert);
    color: white;
}

button:disabled {
    opacity: .3;
    cursor: default;
}

@media(max-width: 750px) {
    .container {
        padding: 20px;
    }

    .slide,
    .cover {
        grid-template-columns: minmax(0, 1fr);
        gap: 25px;
    }

    .image {
        height: min(320px, 45vh);
        min-height: 180px;
    }

    .cover .image {
        height: 220px;
        border-radius: 24px;
    }

    .category-copy {
        padding: 24px;
    }

    .category-visual {
        min-height: 180px;
        height: 220px;
        border-radius: 24px;
    }

    .category-visual-number {
        font-size: 100px;
    }

    h1 {
        font-size: 55px;
    }

    h2 {
        font-size: 38px;
    }

    .description {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">
        <span aria-hidden="true">🌍</span>
        CONSTAT ÉCOLOGIQUE
    </div>

    <div id="counter">01 / 13</div>
</header>

<main id="presentation">

<!-- INTRODUCTION -->

<section class="slide cover active">

    <div>
        <div class="eyebrow">Développement durable · STI2D</div>

        <h1>Un équilibre<br>qui se fragilise.</h1>

        <p class="description">
            Le constat écologique : comprendre les changements
            qui touchent notre environnement et leurs conséquences
            sur nos ressources.
        </p>

        <div class="note">
            3 PARTIES · 11 CONSTATS · 3 MINUTES
        </div>
    </div>

    <div class="image">
        CLIMAT · RESSOURCES · ENVIRONNEMENT
    </div>

</section>

</main>

<footer>
    <div class="progress">
        <span id="bar"></span>
    </div>

    <button id="prev">←</button>
    <button id="next">→</button>
</footer>

</div>

<script>

// LES 11 MOTS-CLÉS

const groupes = [
    {
        titre: "Dérèglement climatique",
        description: "La hausse des températures transforme les glaces, les océans et les équilibres climatiques.",
    },
    {
        titre: "Pollutions et risques environnementaux",
        description: "Les activités humaines polluent les milieux et produisent des déchets qui nécessitent une gestion durable.",
    },
    {
        titre: "Raréfaction des ressources naturelles",
        description: "L’eau potable et les terres cultivables sont des ressources essentielles, mais limitées.",
    }
];

const sujets = [

{
    groupe: 0,
    categorie: "Climat",
    titre: "Réchauffement et dérèglement de l’effet de serre",
    texte: "L’effet de serre est un phénomène naturel. Mais l’augmentation des gaz à effet de serre le renforce et déséquilibre le climat.",
    note: "Un phénomène global",
    image: "rechauffement.png"
},

{
    groupe: 0,
    categorie: "Température",
    titre: "Augmentation de la température",
    texte: "La hausse des températures moyennes entraîne des épisodes de chaleur plus fréquents et accentue les dérèglements climatiques.",
    note: "Des conséquences en chaîne",
    image: "temperature.png"
},

{
    groupe: 0,
    categorie: "Glaces",
    titre: "Fonte des glaces",
    texte: "Avec la hausse des températures, les glaciers et les grandes masses de glace perdent de plus en plus de volume.",
    note: "Les milieux naturels se transforment",
    image: "fonte-glaces.png"
},

{
    groupe: 0,
    categorie: "Banquise",
    titre: "Diminution de l’épaisseur de la banquise",
    texte: "La banquise devient plus fragile et moins épaisse. Cette évolution perturbe les écosystèmes polaires.",
    note: "Un équilibre fragile",
    image: "banquise.jpg"
},

{
    groupe: 0,
    categorie: "Océans",
    titre: "Augmentation du niveau de la mer",
    texte: "La fonte des glaces continentales et la dilatation de l’eau quand elle se réchauffe contribuent à faire monter le niveau des océans.",
    note: "Les zones côtières sont concernées",
    image: "niveau-mer.png"
},

{
    groupe: 1,
    categorie: "Déchets",
    titre: "Désavantage : les déchets nucléaires",
    texte: "La production d’électricité nucléaire génère des déchets radioactifs. Certains doivent être isolés et surveillés sur de très longues périodes.",
    note: "Une gestion sur le long terme",
    image: "dechets-nucleaires.jpg"
},

{
    groupe: 1,
    categorie: "Agriculture",
    titre: "Désavantage : les pesticides",
    texte: "Les pesticides peuvent protéger les cultures, mais leur utilisation peut aussi contaminer les sols et l’eau et affecter des organismes non ciblés.",
    note: "Un usage à encadrer",
    image: "pesticides.png"
},

{
    groupe: 1,
    categorie: "Eau",
    titre: "Pollution de l’eau",
    texte: "Les rejets, les déchets et certaines substances chimiques dégradent la qualité des eaux et menacent les milieux aquatiques.",
    note: "Préserver les ressources en eau",
    image: "pollution-eau.png"
},

{
    groupe: 2,
    categorie: "Ressource vitale",
    titre: "Moins d’eau potable disponible par habitant",
    texte: "La pollution, les sécheresses et la répartition inégale de la ressource peuvent réduire la quantité d’eau potable accessible à chacun.",
    note: "L’accès à l’eau est essentiel",
    image: "eau-potable.png"
},

{
    groupe: 1,
    categorie: "Sols",
    titre: "Pollution des sols",
    texte: "Les activités industrielles, agricoles et humaines peuvent laisser des polluants dans les sols et affecter les écosystèmes.",
    note: "Des effets parfois durables",
    image: "pollution-sols.png"
},

{
    groupe: 2,
    categorie: "Agriculture et alimentation",
    titre: "Moins de terres cultivables disponibles",
    texte: "L’artificialisation, l’érosion et la dégradation des sols réduisent les surfaces qui peuvent être utilisées pour produire des aliments.",
    note: "Préserver les terres agricoles",
    image: "terres-cultivables.png"
}

];

// CRÉATION DES CATÉGORIES ET DE LEURS DIAPOSITIVES

const presentation = document.getElementById("presentation");

groupes.forEach((groupe, groupeIndex) => {
    const numeroGroupe = String(groupeIndex + 1).padStart(2, "0");
    const sujetsDuGroupe = sujets.filter(s => s.groupe === groupeIndex);
    const diapoCategorie = document.createElement("section");

    diapoCategorie.className = "slide category-intro";
    diapoCategorie.innerHTML = `
        <div class="category-copy">
            <div class="eyebrow">PARTIE ${numeroGroupe} / 03</div>
            <h2>${groupe.titre}</h2>
            <p class="description">${groupe.description}</p>
            <div class="note">${sujetsDuGroupe.length} MOTS-CLÉS</div>
        </div>
        <div class="category-visual" aria-hidden="true">
            <span class="category-visual-number">${numeroGroupe}</span>
            <span class="category-visual-label">CONSTAT ÉCOLOGIQUE</span>
        </div>
    `;
    presentation.appendChild(diapoCategorie);

    sujetsDuGroupe.forEach(s => {
        const numero = sujets.indexOf(s) + 1;
        const slide = document.createElement("section");

        slide.className = "slide";
        slide.innerHTML = `
            <div>
                <div class="category-marker">
                    PARTIE ${numeroGroupe} · ${groupe.titre}
                </div>
                <div class="eyebrow">
                    ${String(numero).padStart(2, "0")} · ${s.categorie}
                </div>
                <h2>${s.titre}</h2>
                <p class="description">${s.texte}</p>
                <div class="note">↗ ${s.note}</div>
            </div>
            <div class="image">
                <img src="images/${s.image}" alt="${s.titre}">
            </div>
        `;
        presentation.appendChild(slide);
    });
});

// CONCLUSION

let conclusion = document.createElement("section");

conclusion.className = "slide conclusion";

conclusion.innerHTML = `

    <div>

        <div class="eyebrow">
            POUR CONCLURE
        </div>

        <h2>
            Protéger les ressources,
            c’est préserver notre avenir.
        </h2>

        <p class="description">
            Le climat, l’eau et les sols sont liés.
            Les choix que nous faisons aujourd’hui ont des
            conséquences sur les conditions de vie de demain.

            L’enjeu est donc de limiter les pollutions
            et de gérer les ressources de façon durable.
        </p>

        <div class="note">
            ✓ MERCI DE VOTRE ATTENTION
        </div>

    </div>

`;

document.getElementById("presentation")
    .appendChild(conclusion);


// NAVIGATION

const slides = document.querySelectorAll(".slide");

let index = 0;

function afficher() {

    slides.forEach((slide, i) => {
        slide.classList.toggle("active", i === index);
    });

    document.getElementById("counter").textContent =
        String(index + 1).padStart(2,"0")
        + " / "
        + String(slides.length).padStart(2,"0");

    document.getElementById("bar").style.width =
        ((index + 1) / slides.length * 100) + "%";

    document.getElementById("prev").disabled = index === 0;

    document.getElementById("next").disabled =
        index === slides.length - 1;
}

function suivant() {

    if (index < slides.length - 1) {
        index++;
        afficher();
    }

}

function precedent() {

    if (index > 0) {
        index--;
        afficher();
    }

}

document.getElementById("next")
    .addEventListener("click", suivant);

document.getElementById("prev")
    .addEventListener("click", precedent);

document.addEventListener("keydown", e => {

    if (e.key === "ArrowRight" || e.key === " ") {
        e.preventDefault();
        suivant();
    }

    if (e.key === "ArrowLeft") {
        precedent();
    }

});


afficher();

</script>

</body>
</html>
